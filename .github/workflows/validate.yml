name: Validate site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check README badges
        run: npm run check:badges
      - name: Validate container deployment
        env:
          ENBW_API_KEY: ci-placeholder
        run: |
          docker compose config --quiet
          docker build --tag charge-nearby:ci .
      - name: Run tests
        run: npm test
