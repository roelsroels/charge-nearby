name: Validate site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check README badges
        run: npm run check:badges
      - name: Validate container deployment
        env:
          ENBW_API_KEY: ci-placeholder
        run: |
          docker compose config --quiet
          docker build --tag charge-nearby:ci .
      - name: Run tests
        run: npm test
