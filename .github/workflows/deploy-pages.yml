name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh public charging snapshot
        run: node scripts/update-chargers.mjs
      - name: Verify refreshed site
        run: |
          node --check html/app.js
          node --test tests/smoke.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public web root
        uses: actions/upload-pages-artifact@v4
        with:
          path: html
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
