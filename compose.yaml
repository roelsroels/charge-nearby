services:
  charge-nearby:
    build: .
    restart: unless-stopped
    environment:
      ENBW_API_KEY: ${ENBW_API_KEY:?Set ENBW_API_KEY in .env}
      HOST: 0.0.0.0
      PORT: 8080
      CACHE_TTL_MS: 60000
      STALE_TTL_MS: 900000
      STATION_HISTORY_FILE: /data/stations.json
      STATION_HISTORY_TTL_MS: 2592000000
    ports:
      - "8080:8080"
    volumes:
      - charge-nearby-data:/data

volumes:
  charge-nearby-data:
